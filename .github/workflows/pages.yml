name: 静的デモを GitHub Pages に公開

# サンプルデータ版だけを公開する。サーバが無いので、ログイン・走査・LLM判定は動かない。
# 本体を動かすには Supabase を接続した環境が必要（docs/SETUP.md）。

on:
  push:
    branches: [main]
  # 作業ブランチからも手で公開できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1度に1つ。走行中のものは終わらせてから次を出す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # デモが壊れたまま公開されないよう、先に検査する
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - uses: actions/configure-pages@v5
        id: pages

      - name: 静的デモをビルド
        # Pages は https://<user>.github.io/<repo>/ に置かれるため前置きが必要
        run: npm run build:demo
        env:
          STATIC_DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 鍵は渡さない。渡しても静的書き出しには使えず、公開物に混ざる危険だけが残る
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
