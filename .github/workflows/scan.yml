name: 走査（スケジュール実行）

# ※現在、自動実行（schedule トリガー）は停止中。下の on: を参照。
# 再開するまで走査は「Run workflow」か 09設定画面の「今すぐ走査する」からの
# 手動実行のみで行われる。
#
# 走査は GitHub Actions で回す。Vercel の関数には実行時間の上限があり、
# 31項目 × 校数のLLM判定を1回のリクエストで終わらせるのは無理があるため。
# Actions なら1ジョブ6時間まで使えるので、走査が途中で切れる心配がない。
#
# どの学校をいつ走査するかの判断はアプリ側（settings.ts の isScanDue）が持つ。
# ここは起こすだけで、実際に走るのはスケジュールに達した学校のみ。
#
# このワークフロー自体は週1回＋拾い直しで起こす。設定画面の走査頻度（既定は
# 自校・比較校とも月次）とは別の話で、頻度をどう設定しても変える必要はない：
# 「起こす頻度」を「実際に走査すべき頻度」より高くしておくことで、
# 失敗したときに数日以内で拾い直せるようにしている。月次の設定でも
# 月1回しか起こさなければ、失敗した月はまるまる1か月放置される。
#
# 仕組みは追加していない：前回走査として数えるのは「走り切った回」だけなので
# （runner.ts の loadScanTargets が status='done' で絞っている）、
# 失敗した学校は次に起きたときも対象のままになる。逆に成功した学校は
# 次にスケジュールが来るまで対象にならない。
#
#   月曜 … 通常の確認
#   水曜・金曜 … 失敗した学校の拾い直し。全部成功していれば0校で終わる
#
# つまりほとんどの回は、対象が無ければ数秒で終わって何も走査しない。

on:
  # 自動実行は一時停止中。schedule トリガーをまるごとコメントアウトしてある
  # （disable/enable のGitHub UI操作ではなく、コードとして残すため）。
  # 再開する場合はこのコメントを外す。
  #
  # schedule:
  #   # 日曜 21:00 UTC = 月曜 6:00 JST（通常の確認）。
  #   # 走査頻度の設定を変えても、この cron 自体は変えなくてよい
  #   # （上のコメントのとおり「起こす頻度」と「実際に走査すべき頻度」は別）。
  #   - cron: '0 21 * * 0'
  #   # 火・木 21:00 UTC = 水・金 6:00 JST（失敗した学校の拾い直し）。
  #   # 全部成功していれば対象0校で終わる。
  #   - cron: '0 21 * * 2,4'
  #
  # 停止中も手動実行はできる（Actions タブの Run workflow、または
  # 09設定画面の「今すぐ走査する」ボタンは /api/scan/run-now を使うため
  # この workflow_dispatch とは別経路で、こちらの停止に影響されない）。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '対象を確認するだけ（走査しない）'
        type: boolean
        default: false

# 走査が重なると相手校への同時接続数が設定値を超える
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 走査は時間がかかる。既定の6時間より短く切って、異常時に気づけるようにする
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 走査対象を確認
        run: npm run scan:due
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRAWL_USER_AGENT: ${{ secrets.CRAWL_USER_AGENT }}

      - name: 走査を実行
        if: ${{ !inputs.dry_run }}
        run: npm run scan:due -- --run
        env:
          # スケジュール起動か手動起動かを実行履歴に残す（設定画面の 09 に出る）
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRAWL_USER_AGENT: ${{ secrets.CRAWL_USER_AGENT }}
